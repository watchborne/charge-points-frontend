name: E2E full stack (nightly)

# Drives the frontend against a REAL backend and a REAL (local) Supabase, as
# opposed to e2e.yml's frontend-only specs. Nightly + manual only: it pulls the
# backend image and boots Supabase's Docker stack, which is far too slow/expensive
# to run on every PR (Actions bills per job, rounded up to the minute).
#
# Backend: the image the server's manual Release workflow publishes
# (ghcr.io/watchborne/charge-points-server:latest), i.e. the last RELEASED
# backend, run with PERSISTENCE=memory so it serves its seeded demo fleet.
#
# Why the login goes through /auth/dev-login rather than the /login form: the
# form's access gate (POST /api/access-requests/check-login) needs an *approved*
# access request, which the in-memory backend can't hold (approval is the
# db-only `db:decide-access-request` script). The form and its gate are covered
# by the frontend-only specs; here the point is the Supabase -> frontend ->
# backend chain.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      backend-image-tag:
        description: "charge-points-server image tag to test against"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-full-stack
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/watchborne/charge-points-server:${{ inputs.backend-image-tag || 'latest' }}
  E2E_USER_EMAIL: e2e@example.com
  APP_API_KEY: e2e-shared-secret

jobs:
  e2e-full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/workflows/composites/install-dependencies
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Same dependency-light trick as the rest of the repo: no committed
      # supabase/ directory, a default config is generated for the run.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: |
          supabase init --force
          # Auth + Postgres are all the flows need; skip the rest to save boot time.
          supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - name: Export Supabase credentials
        run: |
          supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          {
            echo "SUPABASE_API_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$JWT_SECRET"

      # The backend grants the seeded fleet to ONE user id at boot, so the user
      # has to exist before the backend starts.
      - name: Create the test user
        run: |
          id=$(curl -fsS -X POST "$SUPABASE_API_URL/auth/v1/admin/users" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_USER_EMAIL\",\"email_confirm\":true}" | jq -r .id)
          test -n "$id" && test "$id" != "null"
          echo "E2E_USER_ID=$id" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.NPM_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --network host: tokens carry iss=<SUPABASE_URL>/auth/v1 and the backend
      # checks it, so it must reach Supabase at the very same 127.0.0.1 URL.
      - name: Start the backend
        run: |
          docker run -d --name backend --network host \
            -e PERSISTENCE=memory \
            -e APP_API_KEY="$APP_API_KEY" \
            -e SUPABASE_URL="$SUPABASE_API_URL" \
            -e SUPABASE_JWT_SECRET="$SUPABASE_JWT_SECRET" \
            -e SEED_MEMBERSHIP_USER_ID="$E2E_USER_ID" \
            "$BACKEND_IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health && exit 0
            sleep 2
          done
          docker logs backend
          exit 1

      - name: Run Playwright (full stack)
        run: npx playwright test --project=full-stack
        env:
          E2E_FULL_STACK: "true"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:3000/ws
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          API_SECRET_KEY: ${{ env.APP_API_KEY }}

      - name: Backend logs
        if: failure()
        run: docker logs backend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-full-stack
          path: playwright-report/
          retention-days: 7
