name: Release

# Manual, one-shot release pipeline: tag -> generate a changelog and GitHub
# Release -> deploy that tag to production. Mirrors
# watchborne/charge-points-server's release.yml (see that repo's #376/#377/#382
# for the design and the changelog-generation bugs already found and fixed
# there).
#
# Deliberately does NOT bump package.json: nothing here consumes that field
# (no dependent repo resolves a version from it, unlike
# @watchborne/charge-points-types). The git tag is the single source of truth,
# so no push-to-main step is needed and the default GITHUB_TOKEN is enough
# throughout (no tag protection rules or rulesets on this repo) — no
# RELEASE_TOKEN/PAT secret required.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.4.0 or v1.4.0)"
        required: true
        type: string

permissions:
  contents: write

# Two releases running at once would race on the tag push. Never cancel one in
# flight: a half-finished release leaves a pushed tag with nothing published
# against it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Normalize and validate version
        id: setup
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          # Remove 'v' prefix if present
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $INPUT_VERSION. Expected: major.minor.patch (e.g., 1.4.0)"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.setup.outputs.tag }}"
          git push origin "${{ steps.setup.outputs.tag }}"

  generate-release:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli@^5

      - name: Generate changelog
        id: changelog
        run: |
          # conventional-changelog labels/bounds its FIRST section from
          # package.json's version, which this repo intentionally never bumps
          # (see this workflow's header comment) — that version never matches
          # any tag, so the tool treats it as a still-unreleased section ahead
          # of the real one. Since this job always checks out HEAD exactly at
          # the tag just created, that phantom section's range (latest tag
          # .. HEAD) is always empty. The SECOND section — bounded by the
          # previous real tag and this one — is always the actual content for
          # the release being cut, hence `c==2` (keep from the 2nd header
          # onward), not `c<2` (which keeps the empty phantom first section).
          #
          # The Angular preset's writer heads a release `# ` (H1) when its
          # patch component is 0 (major/minor releases, e.g. v0.1.0) and
          # `## ` (H2) otherwise (true patch releases, e.g. v0.1.1) — the
          # phantom section is always `# ` (package.json's stale version is
          # permanently x.0.0-shaped), but the real second section can be
          # either depending on this release's own version, so both must
          # count as a header line or a `## ` release's content is skipped
          # entirely. See watchborne/charge-points-server#377 and #382 for
          # both bugs found the hard way (empty/wrong-header releases).
          CHANGELOG=$(conventional-changelog -p angular --release-count 2 | awk '/^# |^## /{c++} c==2')
          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ]; then
            CHANGELOG="Release ${{ needs.tag.outputs.tag }}"
          fi
          {
            echo "body<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs:
      - tag
      - generate-release
    uses: ./.github/workflows/deploy-production-netlify.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
    secrets: inherit
