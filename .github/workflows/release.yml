name: Release

# Manual, one-shot release pipeline: create a GitHub Release for the commit ->
# deploy that commit to production. Mirrors watchborne/charge-points-server's
# release.yml: the release version is the short commit SHA (no semver input,
# no separate git tag push — `gh release create --target <sha>` cuts the tag
# itself), and release notes come from GitHub's own generate-notes API (merged
# PRs since the last release, PR URLs rewritten to `[#N](url)` links) instead
# of conventional-changelog.
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Two releases running at once would race. Never cancel one in flight: a
# half-finished release leaves a release published with nothing deployed
# against it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set release version
        id: version
        run: echo "version=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  generate-release:
    needs: setup
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
          SHA: ${{ github.sha }}
        # `gh release create --generate-notes` leaves each PR as a bare URL, which
        # GitHub does not always shorten to `#123` when rendering the release page.
        # Generate the notes ourselves and turn every PR URL into an explicit
        # `[#123](url)` link so the page reads the same everywhere.
        run: |
          NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$VERSION" -f target_commitish="$SHA" --jq .body)
          NOTES=$(printf '%s\n' "$NOTES" | sed -E "s|https://github\.com/${GITHUB_REPOSITORY}/pull/([0-9]+)|[#\1](&)|g")
          gh release create "$VERSION" --target "$SHA" --latest --title "$VERSION" --notes "$NOTES"

  deploy:
    needs:
      - setup
      - generate-release
    uses: ./.github/workflows/deploy-production-netlify.yml
    with:
      ref: ${{ needs.setup.outputs.version }}
    secrets: inherit
