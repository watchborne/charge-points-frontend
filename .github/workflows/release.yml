name: Release

# Manual, one-shot release pipeline: create a GitHub Release for the commit ->
# deploy that commit to production. Mirrors app-desktop's
# trunk-build-test-deploy.yaml deploy-production job and
# watchborne/charge-points-server's release.yml: the release version is the
# short commit SHA (no semver input, no separate git tag push — `gh release
# create --target <sha>` cuts the tag itself), and release notes come from
# GitHub's own --generate-notes (merged PRs since the last release) instead of
# conventional-changelog.
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Two releases running at once would race. Never cancel one in flight: a
# half-finished release leaves a release published with nothing deployed
# against it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set release version
        id: version
        run: echo "version=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  generate-release:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.setup.outputs.version }} --target ${{ github.sha }} --latest --title ${{ needs.setup.outputs.version }} --generate-notes

  deploy:
    needs:
      - setup
      - generate-release
    uses: ./.github/workflows/deploy-production-netlify.yml
    with:
      ref: ${{ needs.setup.outputs.version }}
    secrets: inherit
