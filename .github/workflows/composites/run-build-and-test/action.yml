name: "Run build and unit tests"
description: "Build the Next.js app and run the unit test suite in a single job"

inputs:
  npm-token:
    description: "NPM token for private packages"
    required: true

# Build and unit tests share one job for the same reason the static checks do:
# Actions bills per job rounded UP to the whole minute. The build is ~53s of real
# work and the tests ~31s; run separately they cost 2 + 1 billed minutes, and
# together they land inside 2. This is bin-packing against the billing model, not
# a claim that the two belong together conceptually.
#
# Tests run first: they are the faster signal, and a failing test tells you more
# than a failing build usually does.
runs:
  using: "composite"
  steps:
    - name: Install dependencies
      uses: ./.github/workflows/composites/install-dependencies
      with:
        npm-token: ${{ inputs.npm-token }}

    - name: Run unit tests
      run: npm run test:ci
      shell: bash

    # Persist Next.js's incremental compiler cache between runs, keyed per branch
    # rather than per commit. A per-commit key wrote a fresh ~100 MB entry on
    # every push — 38 of them were sitting in a repo that had crossed the 10 GB
    # per-repository cache limit and was evicting live entries to make room for
    # dead ones. One entry per branch restores just as well: restore-keys still
    # falls back to the newest cache for the same lockfile.
    #
    # The trade-off: actions/cache never overwrites an existing key, so the second
    # and later runs on a branch restore the first run's cache rather than the
    # previous run's. Next.js recompiles what changed on top of it, so this costs
    # a few seconds of extra compile on later pushes, not a cold build.
    - name: Cache Next.js build
      uses: actions/cache@v5
      with:
        path: .next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.head_ref || github.ref_name }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

    - name: Run build
      run: npm run build
      shell: bash
