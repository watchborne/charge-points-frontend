name: Build, Lint, Format and Tests for Pull Requests

# Pull requests only. There is deliberately no `push: main` trigger: a
# `pull_request` run tests the merge ref (PR head already merged into base), so
# re-running everything after the merge re-verified a tree that was just
# verified. Nothing downstream depended on it either — the production deploy is
# `workflow_dispatch` (deploy-production-netlify.yml) and previews are triggered
# by a `/deploy` comment or "ready for review" (deploy-preview-netlify.yml), so
# the main run was a signal nobody consumed. `main`'s branch protection requires
# branches to be up to date before merging, which is what makes the merge-ref
# result trustworthy at merge time.
on:
  pull_request:

permissions:
  checks: write
  contents: read
  packages: read
  pull-requests: write
  statuses: write

# Supersede in-flight runs when a PR is pushed to again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# HOW THIS WORKFLOW IS SIZED — read before splitting a job "for speed".
#
# Actions bills per job, rounded UP to the whole minute. The four checks here do
# roughly 12s (lint + format), 16s (typecheck), 31s (unit tests) and 53s (build)
# of real work, each behind the same ~15s `npm ci`. As four jobs that billed 5
# minutes for 3m18s of compute, most of the overhead being three redundant
# installs. Packed into two jobs it bills 3.
#
# The split is deliberate rather than "everything in one job": one job would bill
# the same 3 minutes but serialize all of it, pushing wall clock past 2 minutes.
# Two roughly equal halves keep the run at ~1m55 for the same price.
#
# `main`'s required status checks must name these two jobs: static-checks and
# build-and-test.
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run lint, format and typecheck
        uses: ./.github/workflows/composites/run-static-checks
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run unit tests and build
        uses: ./.github/workflows/composites/run-build-and-test
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
