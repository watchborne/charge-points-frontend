name: Deploy Frontend to Production (manual)

# Manual, on-demand production deploy to Netlify. Netlify's automatic production
# deploys on push should stay OFF so that going live is always a deliberate,
# auditable action taken from this workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        required: false
        default: "main"

permissions:
  contents: read

# Only one production deploy at a time; never cancel one mid-flight.
concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://watch-borne.com

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/workflows/composites/install-dependencies
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      # Build and deploy are split into two steps on purpose. Running the build
      # separately (without --json) streams the full @netlify/build log to the
      # Actions console, so a build failure shows the real error instead of a
      # bare "exit code 2" — `deploy --build --json` buffers and discards those
      # logs on failure, which hid the cause of a previous failed run.
      - name: Build with Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Needed by .npmrc when the Netlify build installs private @watchborne packages.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # netlify-cli@27 (not @17): the old CLI shipped an @netlify/edge-bundler
          # that fails to bundle the Next.js middleware into an edge function on
          # Node 24 ("(0 , _module.findSourceMap) is not a function"), which broke
          # the production deploy after the upgrade to Next 16.
          npx --yes netlify-cli@27 build

      - name: Deploy to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # --no-build: reuse the artifacts from the "Build with Netlify" step
          # above so we don't build twice.
          npx --yes netlify-cli@27 deploy \
            --no-build \
            --prod \
            --message "Manual production deploy @ ${{ inputs.ref }} (${{ github.sha }})" \
            --json | tee deploy.json
          echo "url=$(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Netlify production deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ref | \`${{ inputs.ref }}\` |"
            echo "| URL | ${{ steps.netlify.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Actor: @${{ github.actor }}"
            echo "- URL: https://watch-borne.com"
          } >> "$GITHUB_STEP_SUMMARY"
