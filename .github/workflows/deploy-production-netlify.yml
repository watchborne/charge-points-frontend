name: Deploy Frontend to Production (manual)

# Manual, on-demand production deploy to Netlify. Netlify's automatic production
# deploys on push should stay OFF so that going live is always a deliberate,
# auditable action taken from this workflow. Also callable from release.yml
# (workflow_call), which deploys the tag it just cut at the end of a release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        required: false
        default: "main"
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        required: false
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Guards against dispatching this workflow file from a branch other than
    # main (the ref a workflow_dispatch/workflow_call run is launched from,
    # not the `ref` input it deploys).
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://watch-borne.com

    steps:
      # `ref:` is what actually makes the `ref` input mean something — without
      # it, checkout defaults to whatever ref this run was launched from (the
      # branch/tag picked in the "Run workflow" dropdown, not the `ref` input
      # text field), so a caller passing `ref: v1.2.0` deployed main's tip
      # instead of that tag whenever they didn't happen to match.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        uses: ./.github/workflows/composites/install-dependencies
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      # Single step on purpose: `deploy --build` runs the @netlify/build build
      # and the deploy in one `netlify-cli` invocation. We deliberately don't
      # pass --json here — on a non-interactive runner --json buffers all
      # output and only prints it as a JSON blob at the very end, which hides
      # the real build error behind a bare "exit code 2" if the build fails
      # (see #191). Plain-text output streams as it happens instead. Since
      # there's no JSON to read the deploy URL from, we parse it out of
      # netlify-cli's non-interactive text output instead (`Production URL:
      # <...>`, printed when stdout isn't a TTY — see netlify-cli's
      # printResults in commands/deploy/deploy.js).
      - name: Build and deploy to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Needed by .npmrc when the Netlify build installs private @watchborne packages.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes netlify-cli@27 deploy \
            --build \
            --prod \
            --message "Manual production deploy @ ${{ inputs.ref }} (${{ github.sha }})" \
            | tee deploy.log
          url=$(grep -oP 'Production URL: <\K[^>]+' deploy.log)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Netlify production deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ref | \`${{ inputs.ref }}\` |"
            echo "| URL | ${{ steps.netlify.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Ref deployed: \`${{ inputs.ref }}\`"
            echo "- Actor: @${{ github.actor }}"
            echo "- URL: https://watch-borne.com"
          } >> "$GITHUB_STEP_SUMMARY"
