version: 2

registries:
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.GH_PACKAGES_READ_TOKEN }}

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    registries:
      - github-npm

    # Dependabot is a large share of CI volume here — 5 of the 23 CI runs in a
    # sampled 12-hour window were Dependabot branches, each costing a full run.
    # The two settings below cut that, and neither weakens anything: security
    # advisories still open a PR immediately, regardless of schedule or grouping.

    # Grouping. Previously only `@watchborne/charge-points-types` was grouped, so
    # every other package opened its own PR. The production/development split
    # keeps a risky runtime bump from being blocked behind an unrelated tooling
    # bump while collapsing the count to at most three PRs.
    groups:
      internal-types:
        patterns:
          - "@watchborne/charge-points-types"
          - "@watchborne/electrons"
      # Minor and patch bumps only. A major version is deliberately left out of
      # every group, so Dependabot opens it as its own PR: one breaking release
      # cannot turn the whole group red, and the culprit is obvious.
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@watchborne/charge-points-types"
          - "@watchborne/electrons"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

    # Toolchain majors are a migration, not a routine bump: TypeScript and
    # Vitest change the compiler and test runner the whole suite depends on
    # (typescript-eslint has to support a TypeScript major first), and a Tailwind
    # major also has to move in step with @watchborne/electrons' tailwind-preset.
    # Dependabot does not open them; bump them by hand when the migration is
    # planned. Minor and patch releases still flow through the groups above, and
    # security advisories are never suppressed.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

    # Dependabot rebases every open PR whenever main moves, re-triggering the
    # whole suite on each one. Rebase on demand instead, by commenting
    # `@dependabot rebase` on a PR when you are ready to merge it.
    rebase-strategy: "disabled"
